[package]
name = "panic-rtt-target"
description = "Logs panic messages over RTT using rtt-target"
version = "0.2.0"
edition = "2021"
readme = "README.md"
keywords = ["no-std", "embedded", "debugging", "rtt"]
license = "MIT"
authors = [
    "Matti Virkkunen <mvirkkunen@gmail.com>",
    "Per Lindgren <per.lindgren@ltu.se>",
]
repository = "https://github.com/probe-rs/rtt-target"

[dependencies]
rtt-target = {version = "0.6.0", path = "../rtt-target" }
critical-section = "1.2.0"
portable-atomic = { version = "1.13.1", default-features = false }

defmt = { version = "1.0.1", optional = true }
# Optional: exit the host debugger via semihosting after the panic is logged.
semihosting = { version = "0.1.20", optional = true, default-features = false }

[features]
default = []
defmt = ["dep:defmt"]
## After logging the panic over RTT, call semihosting SYS_EXIT so QEMU /
## probe-rs / openocd hosts terminate instead of spinning forever.
##
## Do **not** enable this on bare metal without a semihosting-capable debug
## agent: an unhandled BKPT/SVC can hang or fault the target.
semihosting-exit = ["dep:semihosting"]

[package.metadata.docs.rs]
features = ["defmt"]
